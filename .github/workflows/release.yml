# Release automation. A `v*` tag builds and tests the release bundle on the
# Flutter toolchain, packages it with the source PKGBUILD (which accepts the
# CI-built bundle via TRICKSTER_PREBUILT_BUNDLE), attaches the package and its
# checksum to the GitHub release, and commits the matching AUR pin on the
# default branch.
#
# Pushing the refreshed recipe to aur.archlinux.org runs in the `aur` job
# through an SSH deploy key (`AUR_SSH_KEY`), tags only. A manual dispatch is a
# dry run unless `dry_run` is explicitly cleared: it builds and packages but
# never releases, pins, or publishes.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and package without releasing or pinning
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches pubspec
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          if [[ "v$version" != "${GITHUB_REF_NAME}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match pubspec v$version" >&2
            exit 1
          fi

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true
          pub-cache: true

      - name: Install the Linux toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libgtk-layer-shell-dev libwayland-dev \
            libpipewire-0.3-dev

      - name: Analyze and test
        run: |
          flutter pub get
          # The docs site is a separate Dart project with its own deps; the
          # release gate covers the bar's own sources.
          dart analyze lib bin test
          flutter test

      - name: Build the release bundle
        run: |
          flutter build linux --release
          dart compile exe bin/tricksterctl.dart \
            -o build/linux/x64/release/bundle/tricksterctl

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle
          path: build/linux/x64/release/bundle
          if-no-files-found: error

  package:
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: archlinux:base-devel
    steps:
      - name: Prepare the builder
        run: |
          pacman -Syu --noconfirm --needed git fakeroot
          useradd -m builder

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: bundle

      - name: Restore the bundle's executable bits
        # Artifact upload/download does not carry the execute bit, so the
        # packaged binary would install 644 and refuse to start.
        run: |
          chmod +x "$GITHUB_WORKSPACE/bundle/trickster" \
            "$GITHUB_WORKSPACE/bundle/tricksterctl"

      - name: Build the Arch package
        env:
          TRICKSTER_PREBUILT_BUNDLE: ${{ github.workspace }}/bundle
        run: |
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "cd packaging/arch && makepkg --nodeps --nocheck --noconfirm"
          pkgfile="$(su builder -c "cd packaging/arch && makepkg --packagelist" | tail -n1)"
          cp "$pkgfile" .
          pkgname="$(basename "$pkgfile")"
          sha256sum "$pkgname" > asset.sha256

      - name: Update the AUR pin from the built artifact
        run: |
          version="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          hash="$(cut -d' ' -f1 asset.sha256)"
          cd packaging/aur/trickster-bin
          sed -i "s/^pkgver=.*/pkgver=$version/" PKGBUILD
          sed -i "s/^sha256sums=('.*')/sha256sums=('$hash')/" PKGBUILD
          su builder -c "makepkg --printsrcinfo" > .SRCINFO
          test -s .SRCINFO
          grep -q "pkgver = $version" .SRCINFO

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: |
            trickster-*.pkg.tar.zst
            asset.sha256
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pin
          path: |
            packaging/aur/trickster-bin/PKGBUILD
            packaging/aur/trickster-bin/.SRCINFO
          # .SRCINFO is hidden; the default upload skips it, which left the
          # pin job committing an unchanged recipe.
          include-hidden-files: true
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/') && (github.event_name == 'push' || inputs.dry_run == false)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: assets

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            assets/trickster-*.pkg.tar.zst
            assets/asset.sha256
          fail_on_unmatched_files: true

  pin:
    needs: [package, release]
    if: startsWith(github.ref, 'refs/tags/') && (github.event_name == 'push' || inputs.dry_run == false)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pin
          path: packaging/aur/trickster-bin

      - name: Commit the pin
        run: |
          git config user.name 'trickster release'
          git config user.email 'actions@users.noreply.github.com'
          git add packaging/aur/trickster-bin/PKGBUILD \
            packaging/aur/trickster-bin/.SRCINFO
          if git diff --cached --quiet; then
            echo 'pin already current'
          else
            git commit -m "chore: pin the AUR recipe to ${GITHUB_REF_NAME}"
            branch="${{ github.event.repository.default_branch }}"
            git fetch origin "$branch"
            git rebase "origin/$branch"
            git push origin "HEAD:$branch"
          fi

  aur:
    needs: pin
    if: startsWith(github.ref, 'refs/tags/') && (github.event_name == 'push' || inputs.dry_run == false)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Configure the AUR deploy key
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [[ -z "$AUR_SSH_KEY" ]]; then
            echo '::error::AUR_SSH_KEY is not provisioned (see development.md)'
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -T 10 -t ed25519,rsa aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null

      - name: Push the recipe
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/aur -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
        run: |
          version="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          git clone ssh://aur@aur.archlinux.org/trickster-bin.git aur
          cp packaging/aur/trickster-bin/PKGBUILD aur/
          cp packaging/aur/trickster-bin/.SRCINFO aur/
          cd aur
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo 'AUR recipe already current'
            exit 0
          fi
          git -c user.name='trickster release' \
            -c user.email='actions@users.noreply.github.com' \
            commit -m "Update to ${version}-1"
          git push origin HEAD:master
