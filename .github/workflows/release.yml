# Release automation. A `v*` tag builds and tests the release bundle on the
# Flutter toolchain, packages it with the source PKGBUILD (which accepts the
# CI-built bundle via TRICKSTER_PREBUILT_BUNDLE), attaches the package to the
# GitHub release, and commits the matching AUR pin on the default branch.
#
# Pushing the refreshed recipe to aur.archlinux.org runs in the `aur` job
# through an SSH deploy key (`AUR_SSH_KEY`), tags only.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and package without releasing or pinning
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches pubspec
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          if [[ "v$version" != "${GITHUB_REF_NAME}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match pubspec v$version" >&2
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install the Linux toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libgtk-layer-shell-dev libwayland-dev

      - name: Analyze and test
        run: |
          flutter pub get
          # The docs site is a separate Dart project with its own deps; the
          # release gate covers the bar's own sources.
          dart analyze lib bin test
          flutter test

      - name: Build the release bundle
        run: |
          flutter build linux --release
          dart compile exe bin/tricksterctl.dart \
            -o build/linux/x64/release/bundle/tricksterctl

      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: build/linux/x64/release/bundle
          if-no-files-found: error

  package:
    needs: bundle
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Prepare the builder
        run: |
          pacman -Sy --noconfirm git fakeroot
          useradd -m builder

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: bundle

      - name: Build the Arch package
        env:
          TRICKSTER_PREBUILT_BUNDLE: ${{ github.workspace }}/bundle
        run: |
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "cd packaging/arch && makepkg --nodeps --nocheck --noconfirm"
          version="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          cp "packaging/arch/trickster-$version-1-x86_64.pkg.tar.zst" .
          sha256sum "trickster-$version-1-x86_64.pkg.tar.zst" > asset.sha256

      - name: Update the AUR pin from the built artifact
        run: |
          version="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          hash="$(cut -d' ' -f1 asset.sha256)"
          cd packaging/aur/trickster-bin
          sed -i "s/^pkgver=.*/pkgver=$version/" PKGBUILD
          sed -i "s/^sha256sums=('.*')/sha256sums=('$hash')/" PKGBUILD
          su builder -c "makepkg --printsrcinfo" > .SRCINFO

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: trickster-*.pkg.tar.zst
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: pin
          path: |
            packaging/aur/trickster-bin/PKGBUILD
            packaging/aur/trickster-bin/.SRCINFO
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: assets

      - uses: softprops/action-gh-release@v2
        with:
          files: assets/trickster-*.pkg.tar.zst

  pin:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/download-artifact@v4
        with:
          name: pin
          path: packaging/aur/trickster-bin

      - name: Commit the pin
        run: |
          git config user.name 'trickster release'
          git config user.email 'actions@users.noreply.github.com'
          git add packaging/aur/trickster-bin/PKGBUILD \
            packaging/aur/trickster-bin/.SRCINFO
          if git diff --cached --quiet; then
            echo 'pin already current'
          else
            git commit -m "chore: pin the AUR recipe to ${GITHUB_REF_NAME}"
            git push
          fi

  aur:
    needs: pin
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Configure the AUR deploy key
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [[ -z "$AUR_SSH_KEY" ]]; then
            echo '::error::AUR_SSH_KEY is not provisioned (see development.md)'
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519,rsa aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null

      - name: Push the recipe
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/aur
        run: |
          version="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          git clone --depth=1 ssh://aur@aur.archlinux.org/trickster-bin.git aur
          cp packaging/aur/trickster-bin/PKGBUILD aur/
          cp packaging/aur/trickster-bin/.SRCINFO aur/
          cd aur
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo 'AUR recipe already current'
            exit 0
          fi
          git -c user.name='trickster release' \
            -c user.email='actions@users.noreply.github.com' \
            commit -m "Update to ${version}-1"
          git push origin HEAD:master
