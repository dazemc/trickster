# Publishes the docs site to GitHub Pages whenever main changes it. Pull
# requests build the site without deploying. The static build is rewritten for
# the project-site subpath by docs_site/tool/prepare_pages.sh.
name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs_site/**'
      - '.llm/docs.md'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs_site/**'
      - '.llm/docs.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: docs-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: 3.14.1

      - name: Install the Jaspr CLI
        working-directory: docs_site
        run: dart pub global activate jaspr_cli 0.24.0-beta.2

      - name: Analyze and build the site
        working-directory: docs_site
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          dart pub get --enforce-lockfile
          dart analyze
          jaspr build
          tool/prepare_pages.sh
          test -f build/jaspr/index.html
          test -f build/jaspr/status/index.html
          git diff --exit-code -- lib/main.client.options.dart lib/main.server.options.dart

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs_site/build/jaspr

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
