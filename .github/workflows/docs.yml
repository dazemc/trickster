# Publishes the docs site to GitHub Pages whenever main changes it. The
# static build is rewritten for the project-site subpath by
# docs_site/tool/prepare_pages.sh.
name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs_site/**'
      - '.llm/docs.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Build the site
        working-directory: docs_site
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          dart pub global activate jaspr_cli
          dart pub get
          jaspr build
          tool/prepare_pages.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs_site/build/jaspr

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
