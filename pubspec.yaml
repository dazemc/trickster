name: trickster
description: A Flutter-native Wayland status bar
publish_to: "none"
version: 0.2.0

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  dbus: ^0.7.11
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  equatable: ^2.1.0
  ffi: ^2.2.0
  flutter_svg: ^2.3.0
  lucide_icons: ^0.257.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  lints: ^6.1.0

flutter:
  uses-material-design: false
  generate: true
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
