# Trickster machine configuration
#
# The bar automatically selects layer-shell defaults. Override them when a
# session needs a different layer, namespace, or keyboard mode:
# TRICKSTER_LAYER=top
# TRICKSTER_NAMESPACE=trickster
# TRICKSTER_KEYBOARD=on_demand
#
# Without an output override, Trickster initializes and uses
# $XDG_CONFIG_HOME/trickster/outputs.conf. An output override must be a
# session-user-writable file in a writable directory:
# TRICKSTER_OUTPUT_CONFIG=/home/example/.config/trickster/outputs.conf
#
# Accent used until settings.json supplies one:
# TRICKSTER_ACCENT=#d0bcff
#
# Native logging filter:
# TRICKSTER_LOG=trickster=info
