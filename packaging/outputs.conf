# Trickster output configuration template
#
# The packaged session copies this file to the session user's
# $XDG_CONFIG_HOME/trickster/outputs.conf on first launch. Trickster persists
# display changes to that per-user copy. Existing per-user files are never
# overwritten.
#
# With no connector entries, Trickster places a bar on every connected output.
#
# The system bar follows the top edge by default. Examples:
# system_bar=top,32
# system_bar=bottom,40,eDP-1
# system_bar=hidden
